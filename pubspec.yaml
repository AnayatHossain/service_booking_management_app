name: service_booking_management_app
description: "Service Booking & Management Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.4
  flutter_easyloading: ^3.0.5
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get: ^4.6.6
  flutter_svg: ^2.2.3
  skeletonizer: ^3.0.0
  pull_to_refresh: ^2.0.0
  flutter_api_craft: ^0.0.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:  # Hit this: flutter pub run flutter_launcher_icons:main
  image_path: "assets/svg/app_logo.png"
  background_color: "#FFFFFF"
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/svg/app_logo.png"
    background_color: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/svg/app_logo.png"
    background_color: "#FFFFFF"


flutter:
  uses-material-design: true
  assets:
    - assets/svg/
